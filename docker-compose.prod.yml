# Production compose (VozLab) — topology T2 (ADR-0043)
#
# Uses published images instead of building locally. Run:
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run as a one-shot container before the API starts:
#   docker compose -f docker-compose.prod.yml run --rm migrate
#
# Requires a .env file with production secrets (see .env.production.example).
#
# Exposure model (T2): Caddy runs with host networking, terminates TLS
# (automatic Let's Encrypt) and proxies the three origins app./api./auth.
# Every backend publishes ONLY on 127.0.0.1 — the loopback contract that the
# Caddyfile and the API's trustProxy rely on (proxyTrust.ts trusts loopback +
# RFC1918/ULA as literal CIDRs, because Docker NAT presents the bridge
# gateway inside the container). Nothing else is reachable from outside; open
# only 80/443 on the host firewall.
#
# Runbook completo: docs/ops/production-deployment.md

services:
  migrate:
    image: vozlab/api:latest
    container_name: vozlab-migrate
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter @vozlab/database db:migrate:router && pnpm --filter @vozlab/database db:migrate:tenant"]
    networks:
      - vozlab-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: vozlab/postgres:18-age-pgvector
    container_name: vozlab-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    # NOTE: the dev initdb scripts (packages/database/scripts/01,02) hardcode
    # the dev names vozlab_router/vozlab_tenant_dev and are deliberately NOT
    # mounted here. Create the databases for production per
    # docs/ops/production-deployment.md §2 instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vozlab-net

  redis:
    image: redis:7-alpine
    container_name: vozlab-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vozlab-net

  api:
    image: vozlab/api:latest
    container_name: vozlab-api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      # Loopback-only: reached by Caddy (host network) via 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - vozlab-net

  web:
    image: vozlab/web:latest
    container_name: vozlab-web
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5173"
    ports:
      # Loopback-only: reached by Caddy via 127.0.0.1:5173.
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - vozlab-net

  # --- Identity broker (Zitadel) --------------------------------------------
  # The instance must be provisioned once against the public issuer — see
  # docs/ops/production-deployment.md §4 (scripts/setup-zitadel.sh, whose
  # management calls go to the loopback port published below).
  zitadel-db:
    image: postgres:17-alpine
    container_name: vozlab-zitadel-db
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${ZITADEL_DB_PASSWORD:?set ZITADEL_DB_PASSWORD in .env}"
    volumes:
      - zitadel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vozlab-net

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    container_name: vozlab-zitadel
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: "${AUTH_HOSTNAME:?set AUTH_HOSTNAME in .env}"
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${ZITADEL_DB_PASSWORD}@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: "${ZITADEL_BOOTSTRAP_USERNAME:-vozlab-bootstrap}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "${ZITADEL_BOOTSTRAP_NAME:-VozLab Bootstrap}"
    volumes:
      # Same contract as the dev compose: the first-init admin PAT lands in
      # the host directory and scripts/setup-zitadel.sh reads it from there.
      - ${ZITADEL_BOOTSTRAP_DIR:-./zitadel-bootstrap}:/zitadel/bootstrap
    ports:
      # Loopback-only: reached by Caddy via 127.0.0.1:8081 and by the setup
      # script's management calls.
      - "127.0.0.1:8081:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - vozlab-net

  # --- Reverse proxy (T2 terminus, ADR-0043) --------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: vozlab-caddy
    # Host networking so the backends are reachable on 127.0.0.1 — the
    # loopback/private contract of the Caddyfile and of trustProxy.
    network_mode: host
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_HOSTNAME: "${APP_HOSTNAME:?set APP_HOSTNAME in .env}"
      API_HOSTNAME: "${API_HOSTNAME:?set API_HOSTNAME in .env}"
      AUTH_HOSTNAME: "${AUTH_HOSTNAME:?set AUTH_HOSTNAME in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in .env}"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vozlab-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - vozlab-net

  worker-embedder:
    image: vozlab/worker-embedder:latest
    container_name: vozlab-worker-embedder
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vozlab-net

  worker-relacionador:
    image: vozlab/worker-relacionador:latest
    container_name: vozlab-worker-relacionador
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - vozlab-net

  worker-extractor:
    image: vozlab/worker-extractor:latest
    container_name: vozlab-worker-extractor
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - vozlab-net

  floci:
    image: floci/floci:latest
    container_name: vozlab-floci
    profiles: ['aws-emulation']
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/app/data
    networks:
      - vozlab-net

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  floci_data:
  zitadel_db_data:
  caddy_data:
  caddy_config:

networks:
  vozlab-net:
    driver: bridge
