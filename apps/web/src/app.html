<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="VozLab — cliente de co-creación para el grafo de conocimiento." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!--
      The manifest link is declared here on purpose: SvelteKit renders `app.html`
      for SSR, so `vite-plugin-pwa`'s `transformIndexHtml` hook never runs for
      this template (SvelteKit does not emit an `index.html`).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
