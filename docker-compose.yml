version: '3.8'

services:
  postgres:
    build:
      context: ./docker/postgres
    image: vozlab/postgres:18-age-pgvector
    container_name: vozlab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vozlab
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 base images declare VOLUME /var/lib/postgresql
      # (PGDATA lives at /var/lib/postgresql/18/docker).
      - postgres_data:/var/lib/postgresql
      - ./packages/database/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vozlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vozlab-net

  redis:
    image: redis:7-alpine
    container_name: vozlab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vozlab-net

  ollama:
    image: ollama/ollama:latest
    container_name: vozlab-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - vozlab-net

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  vozlab-net:
    driver: bridge