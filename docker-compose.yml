version: '3.8'

services:
  postgres:
    build:
      context: ./docker/postgres
    image: vozlab/postgres:18-age-pgvector
    container_name: vozlab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vozlab
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 base images declare VOLUME /var/lib/postgresql
      # (PGDATA lives at /var/lib/postgresql/18/docker).
      - postgres_data:/var/lib/postgresql
      - ./packages/database/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vozlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vozlab-net

  redis:
    image: redis:7-alpine
    container_name: vozlab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vozlab-net

  ollama:
    image: ollama/ollama:latest
    container_name: vozlab-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - vozlab-net

  # --- Identity broker (profile: idp) ------------------------------------
  # Zitadel replaces Keycloak as the identity broker. Lighter (Go, ~128MB RAM)
  # and multi-tenant native. Only started with --profile idp.
  #
  #   docker compose --profile idp up -d zitadel zitadel-db
  #
  # Console: http://localhost:8081/ui/console
  # Admin: zitadel-admin@zitadel.localhost / Password1!
  #
  # Bootstrap credentials (v4.16+):
  #   The first init creates a machine user (`vozlab-bootstrap`) with the
  #   IAM_OWNER role and writes its PAT to `.zitadel-bootstrap/admin.pat`.
  #   `scripts/setup-zitadel.sh` uses that PAT to provision the project, the
  #   OIDC app and the test user without a browser. The PAT exists only on the
  #   first init of an empty Zitadel database; keep the bind mount so the host
  #   can read it.
  #
  # Public demo behind zrok:
  #   ZITADEL_EXTERNALDOMAIN=vozlabauth.share.zrok.io \
  #   ZITADEL_EXTERNALPORT=443 ZITADEL_EXTERNALSECURE=true \
  #   docker compose --profile idp up -d zitadel zitadel-db
  #
  #   The external domain can be changed without re-initialising the database:
  #   Zitadel rebuilds the OIDC issuer from these values on restart.
  zitadel-db:
    image: postgres:17-alpine
    container_name: vozlab-zitadel-db
    profiles: ["idp"]
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - zitadel_db_data:/var/lib/postgresql/data
    networks:
      - vozlab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 10s
      timeout: 5s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    container_name: vozlab-zitadel
    profiles: ["idp"]
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: "${ZITADEL_EXTERNALDOMAIN:-localhost}"
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNALPORT:-8081}"
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:-false}"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:postgres@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # Admin machine user for unattended provisioning (IAM_OWNER).
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: "${ZITADEL_BOOTSTRAP_USERNAME:-vozlab-bootstrap}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "${ZITADEL_BOOTSTRAP_NAME:-VozLab Bootstrap}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - "${ZITADEL_BOOTSTRAP_DIR:-./.zitadel-bootstrap}:/zitadel/bootstrap:rw"
    networks:
      - vozlab-net
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  # --- Python workers (profile: workers) --------------------------------
  # The API still runs on the host (`pnpm --filter @vozlab/api dev`), so the
  # workers reach it through `host.docker.internal`. The API image lands in
  # Phase 4 (4.6); until then this is the local topology.
  #
  #   docker compose --profile workers up -d worker-embedder worker-relacionador
  #
  # Credentials: the dev profile lets a worker mint its own agent token with
  # the same JWT_SECRET the API uses (ADR-0021). The identity values are the
  # dev fixtures from `packages/database/scripts/dev-identities.ts`; set
  # AGENT_TOKEN / AGENT_TOKEN_FILE instead for anything else.
  worker-embedder:
    build:
      context: .
      dockerfile: apps/worker-embedder/Dockerfile
    image: vozlab/worker-embedder:dev
    container_name: vozlab-worker-embedder
    profiles: ["workers"]
    depends_on:
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE_URL: http://host.docker.internal:3000
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSIONS: "768"
      WORKSPACE_ID: 33333333-3333-4333-8333-333333333333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-}
      AGENT_TENANT_KEY: ${AGENT_TENANT_KEY:-sabana}
      AGENT_USER_ID: ${AGENT_USER_ID:-44444444-4444-4444-8444-444444444448}
      AGENT_AUTHOR_HASH: ${AGENT_AUTHOR_HASH:-3909e5bbd80f2f103337546c552c3cca60be32c2d47f9be64d641ea001c3250b}
    networks:
      - vozlab-net

  worker-relacionador:
    build:
      context: .
      dockerfile: apps/worker-relacionador/Dockerfile
    image: vozlab/worker-relacionador:dev
    container_name: vozlab-worker-relacionador
    profiles: ["workers"]
    depends_on:
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE_URL: http://host.docker.internal:3000
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      NEIGHBORS_LIMIT: "5"
      WORKSPACE_ID: 33333333-3333-4333-8333-333333333333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-}
      AGENT_TENANT_KEY: ${AGENT_TENANT_KEY:-sabana}
      AGENT_USER_ID: ${AGENT_USER_ID:-44444444-4444-4444-8444-444444444447}
      AGENT_AUTHOR_HASH: ${AGENT_AUTHOR_HASH:-7e542874dafc353f457e15db9d96910462164284b71e73ea6d64ac83d3b7405f}
    networks:
      - vozlab-net

  worker-extractor:
    build:
      context: .
      dockerfile: apps/worker-extractor/Dockerfile
    image: vozlab/worker-extractor:dev
    container_name: vozlab-worker-extractor
    profiles: ["workers"]
    depends_on:
      - redis
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE_URL: http://host.docker.internal:3000
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      DEFAULT_TYPE_KEY: Problem
      WORKSPACE_ID: 33333333-3333-4333-8333-333333333333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-}
      AGENT_TENANT_KEY: ${AGENT_TENANT_KEY:-sabana}
      AGENT_USER_ID: ${AGENT_USER_ID:-44444444-4444-4444-8444-444444444447}
      AGENT_AUTHOR_HASH: ${AGENT_AUTHOR_HASH:-7e542874dafc353f457e15db9d96910462164284b71e73ea6d64ac83d3b7405f}
    networks:
      - vozlab-net

  prometheus:
    image: prom/prometheus:latest
    container_name: vozlab-prometheus
    profiles: ['observability']
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vozlab-net

  grafana:
    image: grafana/grafana:latest
    container_name: vozlab-grafana
    profiles: ['observability']
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - vozlab-net

  tempo:
    image: grafana/tempo:latest
    container_name: vozlab-tempo
    profiles: ['observability']
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - vozlab-net

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  zitadel_db_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  vozlab-net:
    driver: bridge