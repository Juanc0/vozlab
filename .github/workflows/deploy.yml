name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        run: |
          docker build -f apps/api/Dockerfile -t ghcr.io/${{ github.repository }}/api:${{ inputs.tag }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ inputs.tag }}

      - name: Build and push Web
        run: |
          docker build -f apps/web/Dockerfile -t ghcr.io/${{ github.repository }}/web:${{ inputs.tag }} .
          docker push ghcr.io/${{ github.repository }}/web:${{ inputs.tag }}

