name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads `packageManager` from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-checks src (build), tests + scripts (type-check), and runs the suite.
      - run: pnpm turbo run build type-check test

      # Coverage (thresholds enforced by vitest config).
      - run: pnpm --filter @vozlab/api test -- --coverage
      - run: pnpm --filter @vozlab/web test -- --coverage

      # Lint (warnings allowed; errors fail).
      - run: pnpm lint

      # Documentation gate: links, heredoc artifacts, dead refs, debris.
      - run: bash scripts/docs-hygiene.sh

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Provision router + tenant databases and seed.
      - name: Provision databases
        env:
          EMAIL_PEPPER: integration-test-pepper-at-least-32-chars-xx # dev-only; seed hashes emails (DEC-4)
          # COUPLED to the F1 seeded-subject integration test: the suite
          # forces this exact issuer, and that test RESTORES (never deletes)
          # the identity rows this seed writes under it. Change both together
          # — if the issuers diverge, the test's cleanup branch switches shape.
          OIDC_ISSUER: http://127.0.0.1:18080/realms/vozlab # same mock realm the integration suite asserts (setup/env.ts) — keeps the CI seed artifact byte-identical to local
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE vozlab_router;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE vozlab_tenant_dev;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d vozlab_router -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d vozlab_tenant_dev -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          pnpm --filter @vozlab/database db:migrate:router
          pnpm --filter @vozlab/database db:migrate:tenant
          pnpm --filter @vozlab/database db:seed:dev

      - name: Run integration suite
        run: pnpm --filter @vozlab/api test:integration

  python:
    name: Python worker runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action publishes full tags only (v10 does not exist; first CI run
      # proved it: "unable to find version v10").
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.8"
          enable-cache: true

      # `--frozen` fails when uv.lock is out of date: the lockfile is the
      # contract, never a fresh resolution.
      - run: uv sync --frozen --all-packages --all-groups

      - run: uv run pytest

      - run: uv run ruff check packages/worker-shared apps/worker-embedder apps/worker-relacionador

      - run: uv run ruff format --check packages/worker-shared apps/worker-embedder apps/worker-relacionador

  images:
    name: Worker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The worker images build from the repository root (uv workspace).
      - name: Build the embedder image
        run: docker build -f apps/worker-embedder/Dockerfile -t vozlab/worker-embedder:ci .

      - name: Build the Relator image
        run: docker build -f apps/worker-relacionador/Dockerfile -t vozlab/worker-relacionador:ci .

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t vozlab/api:ci .

      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t vozlab/web:ci .
