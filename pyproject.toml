[tool.uv.workspace]
members = [
  "packages/worker-shared",
  "apps/worker-embedder",
  "apps/worker-relacionador",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "fakeredis>=2.23,<3",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/worker-shared/tests",
  "apps/worker-embedder/tests",
  "apps/worker-relacionador/tests",
]
# `--import-mode=importlib` lets two worker packages use the same test file
# names (e.g. `test_handler.py`) without a module-name collision.
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "packages/worker-shared/src",
  "apps/worker-embedder/src",
  "apps/worker-relacionador/src",
]
extend-exclude = [".agents", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
