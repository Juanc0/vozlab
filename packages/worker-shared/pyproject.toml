[project]
name = "vozlab-worker"
version = "0.1.0"
description = "Shared Python runtime for VozLab AI and embedding workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<0.29",
  "PyJWT>=2.9,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vozlab_worker"]
